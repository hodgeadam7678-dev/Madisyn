<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Happy 2 Months, My Sweet Baby Bear 🐰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap');

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            padding-top: 90px;
            font-family: 'Poppins', sans-serif;
            color: #ff8fa3;
            text-align: center;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ff9ef8, #c79fff, #ff6eff);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.8rem;
            color: white;
            text-shadow: 0 0 25px rgba(255,255,255,0.9), 0 0 40px #ff6eff;
            margin: 20px 0 10px;
        }

        .subtitle { font-size: 1.7rem; color: #ffe0ff; margin-bottom: 30px; }

        section {
            background: rgba(255,255,255,0.22);
            border-radius: 40px;
            padding: 45px 35px;
            margin: 40px auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.5);
            position: relative;
            z-index: 2;
        }

        .voice-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 25px 0;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            transition: all 0.3s;
            font-weight: bold;
        }
        .voice-btn:hover {
            transform: scale(1.08);
            background: #ff6eff;
            box-shadow: 0 12px 25px rgba(255, 110, 239, 0.5);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .gallery img {
            width: 100%;
            border-radius: 25px;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: 0.4s;
        }
        .gallery img:hover { transform: scale(1.06) rotate(2deg); }

        .message { line-height: 1.75; font-size: 1.2rem; color: white; }

        footer {
            margin-top: 60px;
            padding: 30px;
            font-size: 1.3rem;
            color: #ffe0ff;
            position: relative;
            z-index: 2;
        }

        .floating {
            position: fixed;
            top: -80px;
            z-index: 1;
            pointer-events: none;
            animation: floatUp linear infinite;
            opacity: 0.45;
        }

        @keyframes floatUp {
            0% { transform: translate(0,110vh) rotate(0deg); }
            100% { transform: translate(var(--driftX), -100px) rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Happy 2 Months, Madi 🐰💕</h1>
    <p class="subtitle">My sweet baby bear • my precious bunny • my rabbit • my doll • my love</p>

    <section id="message">
        <h2 style="color:white; font-size:2.2rem;">My Love Note to You</h2>
        <div class="message">
            <p>Hey my sweet baby bear…</p>
            <p>I can’t believe we’re already at 2 months together...</p>
        </div>

        <button class="voice-btn" onclick="playVoiceNote()">🎤 Play My Voice Note 💌</button>
    </section>

    <section id="photos">
        <h2 style="color:white;">My Baby Bunny 🐰</h2>
        <div class="gallery" id="gallery"></div>
    </section>
</div>

<footer>
    <p>I love you so so much ❤️</p>
</footer>

<audio id="bgMusic" loop autoplay>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<audio id="voiceNote">
    <source src="voice-note.mp3" type="audio/mpeg">
</audio>

<script>
function loadGallery() {
    const gallery = document.getElementById('gallery');
    for (let i = 1; i <= 3; i++) {
        const img = document.createElement('img');
        img.src = `photos/${i}.jpg`;
        gallery.appendChild(img);
    }
}

function playVoiceNote() {
    document.getElementById('voiceNote').play();
}

// ⭐ SECRET HEART (ONLY ONE THAT WORKS)
let secretHeartCreated = false;

function createFloater() {
    const floater = document.createElement('div');
    floater.className = 'floating';

    const emojis = ['❤️','💕','💖','🌸','✨'];

    let emoji;

    if (!secretHeartCreated) {
        emoji = '💖'; // THIS is the secret one
        secretHeartCreated = true;

        floater.style.pointerEvents = 'auto';
        floater.style.cursor = 'pointer';

        floater.onclick = () => {
            window.open("https://drive.google.com/drive/folders/1aZEU1bU5fUCQU2qoRf3hbQBnrNM_mEum?usp=sharing", "_blank");
        };
    } else {
        emoji = emojis[Math.floor(Math.random() * emojis.length)];
    }

    floater.innerText = emoji;

    const drift = (Math.random() * 200 - 100) + 'px';
    floater.style.setProperty('--driftX', drift);

    floater.style.left = Math.random() * 100 + 'vw';
    floater.style.fontSize = (Math.random() * 28 + 22) + 'px';
    floater.style.animationDuration = (Math.random() * 20 + 25) + 's';

    document.body.appendChild(floater);
    setTimeout(() => floater.remove(), 50000);
}

window.onload = () => {
    loadGallery();

    setInterval(createFloater, 900);

    for (let i = 0; i < 12; i++) {
        setTimeout(createFloater, i * 600);
    }
};
</script>

</body>
</html>
