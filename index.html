<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 2 Months, My Sweet Baby Bear 🐰</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap');

body {
    margin: 0;
    padding-top: 90px;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    overflow-x: hidden;
    background: linear-gradient(135deg, #ff9ef8, #c79fff, #ff6eff);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
}

/* background animation */
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* spider webs */
body::before, body::after {
    content: "";
    position: fixed;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 2px);
    background-size: 20px 20px;
    opacity: 0.15;
}

body::before { top: 0; left: 0; }
body::after { top: 0; right: 0; }

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 3.5rem;
    color: white;
    animation: glow 3s infinite;
}

@keyframes glow {
    0%,100% { text-shadow: 0 0 20px #fff; }
    50% { text-shadow: 0 0 40px #ff6eff; }
}

.subtitle { color: white; }

/* floating boxes */
section {
    background: rgba(255,255,255,0.2);
    padding: 40px;
    margin: 40px 0;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    animation: float 6s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

section:hover {
    transform: translateY(-10px) scale(1.02);
}

/* button */
.voice-btn {
    padding: 15px 30px;
    border-radius: 40px;
    border: none;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
}

.voice-btn:hover {
    transform: scale(1.1);
    background: #ff6eff;
}

/* gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 20px;
}

.gallery img {
    width: 100%;
    border-radius: 20px;
    transition: 0.4s;
}

.gallery img:hover {
    transform: scale(1.05) rotate(2deg);
}

/* floating emojis */
.floating {
    position: fixed;
    top: -80px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(110vh); }
    100% { transform: translateY(-100px); }
}

.message {
    color: white;
    line-height: 1.6;
    font-size: 1.2rem;
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy 2 Months, Madi 🐰💕</h1>
    <p class="subtitle">My sweet baby bear 💖</p>

    <section>
        <h2 style="color:white;">My Love Note to You</h2>
        <div id="typedMessage" class="message"></div>

        <button class="voice-btn" onclick="playVoiceNote()">
            🎤 Play My Voice Note
        </button>
    </section>

    <section>
        <h2 style="color:white;">My Baby Bunny 🐰</h2>
        <div class="gallery" id="gallery"></div>
    </section>
</div>

<audio id="voiceNote">
    <source src="voice-note.mp3" type="audio/mpeg">
</audio>

<script>
// 💬 message
const message = `Hey my sweet baby bear…

I can’t believe we’re already at 2 months together. These past two months with you have been so amazing. Time with you just flies by because every single day feels so good and easy.

Baby, I love you so much. I’m really grateful to have you in my life and to be able to call you mine. You make me feel amazing in a way I’ve never felt for anyone before. Every time I see your face, my heart lights up and I can’t stop smiling.

I’m so happy I get to be your first boyfriend who actually treats you right.

My rabbit, my doll, my sweet girl… you’re my everything.`;

// typing effect
function typeText(text, el, speed=28) {
    let i = 0;
    function type() {
        if(i < text.length){
            if(text[i] === "\n"){
                el.innerHTML += "<br><br>";
            } else {
                el.innerHTML += text[i];
            }
            i++;
            setTimeout(type, speed);
        }
    }
    type();
}

// gallery
function loadGallery() {
    const gallery = document.getElementById('gallery');
    for (let i = 1; i <= 3; i++) {
        const img = document.createElement('img');
        img.src = `photos/${i}.jpg`;
        gallery.appendChild(img);
    }
}

// voice note
function playVoiceNote(){
    document.getElementById("voiceNote").play();
}

// floating emojis
function createFloater() {
    const f = document.createElement("div");
    f.className = "floating";
    f.innerText = ["🐰","💖","✨"][Math.floor(Math.random()*3)];
    f.style.left = Math.random()*100+"vw";
    f.style.fontSize = "24px";
    f.style.animationDuration = (20+Math.random()*10)+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),30000);
}

// init
window.onload = () => {
    loadGallery();
    typeText(message, document.getElementById("typedMessage"), 28);

    setInterval(createFloater, 800);
};
</script>

</body>
</html>
